name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify:web

  deno:
    name: deno
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Verify Edge Functions
        run: deno task --config supabase/deno.json verify

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # ECR rate-limited this job; local pnpm commands use the same GHCR mirror.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect database-related changes
        id: database_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          required=true

          if [[ "$EVENT_NAME" == "pull_request" ]] && git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- \
            .github/workflows/ci.yml \
            .node-version \
            package.json \
            pnpm-lock.yaml \
            scripts/generate-database-types.mjs \
            scripts/run-supabase.mjs \
            scripts/supabase-command.mjs \
            scripts/supabase-type-command.mjs \
            src/types/database.generated.ts \
            supabase/config.toml \
            supabase/migrations \
            supabase/seed.sql \
            supabase/tests/database; then
            required=false
          fi

          echo "required=$required" >> "$GITHUB_OUTPUT"

      - name: Skip database verification
        if: steps.database_changes.outputs.required == 'false'
        run: echo "No database-related changes detected."

      - name: Set up Supabase CLI
        if: steps.database_changes.outputs.required == 'true'
        uses: supabase/setup-cli@v3

      - name: Start local database
        if: steps.database_changes.outputs.required == 'true'
        run: supabase db start

      - name: Verify generated database types are current
        if: steps.database_changes.outputs.required == 'true'
        run: |
          generated_types="$(mktemp)"
          trap 'rm -f "$generated_types"' EXIT

          supabase gen types --lang typescript --local --schema public > "$generated_types"
          if ! git diff --no-index --ignore-space-at-eol --quiet src/types/database.generated.ts "$generated_types"; then
            echo "src/types/database.generated.ts is out of date. Run pnpm supabase:types and commit the result."
            git diff --no-index --ignore-space-at-eol -- src/types/database.generated.ts "$generated_types" || true
            exit 1
          fi

      - name: Run database tests
        if: steps.database_changes.outputs.required == 'true'
        run: supabase test db

  verify:
    name: verify
    if: ${{ always() }}
    needs:
      - web
      - deno
      - database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all verification jobs
        env:
          WEB_RESULT: ${{ needs.web.result }}
          DENO_RESULT: ${{ needs.deno.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          test "$WEB_RESULT" = "success"
          test "$DENO_RESULT" = "success"
          test "$DATABASE_RESULT" = "success"
