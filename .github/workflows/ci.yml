name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify:web

  deno:
    name: deno
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Verify Edge Functions
        run: deno task --config supabase/deno.json verify

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local database
        run: pnpm exec supabase db start

      - name: Verify generated database types are current
        run: |
          pnpm supabase:types
          if ! git diff --ignore-space-at-eol --exit-code --quiet -- src/types/database.generated.ts; then
            echo "src/types/database.generated.ts is out of date. Run pnpm supabase:types and commit the result."
            git diff -- src/types/database.generated.ts
            exit 1
          fi

      - name: Run database tests
        run: pnpm verify:db

  verify:
    name: verify
    if: ${{ always() }}
    needs:
      - web
      - deno
      - database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all verification jobs
        env:
          WEB_RESULT: ${{ needs.web.result }}
          DENO_RESULT: ${{ needs.deno.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          test "$WEB_RESULT" = "success"
          test "$DENO_RESULT" = "success"
          test "$DATABASE_RESULT" = "success"
